<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUA Meeting Room v0.8.0 - 职场会议室模拟器</title>
  <meta name="description" content="PUA Meeting Room - 多角色职场会议模拟，选择参会者开始一场充满职场PUA的会议">
  <meta property="og:title" content="PUA Meeting Room - 职场会议室">
  <meta property="og:description" content="多角色同时参会的职场会议模拟器，6种角色随机搭话，体验真实会议讨论">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      background: #0a0a0a;
      min-height: 100vh;
      overflow-x: hidden;
      color: #e0e0e0;
    }

    /* === Nav Bar === */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #111;
      border-bottom: 1px solid #222;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .nav-bar::-webkit-scrollbar { height: 0; }
    .nav-link {
      color: #666;
      text-decoration: none;
      font-size: 12px;
      padding: 10px 14px;
      white-space: nowrap;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
      flex-shrink: 0;
    }
    .nav-link:hover {
      color: #ccc;
      background: #1a1a1a;
    }
    .nav-link.active {
      color: #00ccff;
      border-bottom-color: #00ccff;
    }

    /* === Terminal Shell === */
    .terminal {
      width: 94%;
      max-width: 960px;
      margin: 30px auto 40px;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      overflow: hidden;
    }

    .terminal-header {
      padding: 10px 16px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #333;
    }

    .terminal-buttons { display: flex; gap: 8px; }
    .terminal-btn { width: 12px; height: 12px; border-radius: 50%; }
    .terminal-btn.close { background: #ff5f56; }
    .terminal-btn.minimize { background: #ffbd2e; }
    .terminal-btn.maximize { background: #27ca3f; }
    .terminal-title { color: #888; font-size: 12px; flex: 1; text-align: center; }

    /* === Views === */
    .view { display: none; flex-direction: column; flex: 1; min-height: 0; }
    .view.active { display: flex; }

    /* === SETUP VIEW === */
    #setupView { padding: 24px; overflow-y: auto; }

    .setup-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .setup-header h2 {
      color: #00ff00;
      font-size: 22px;
      margin-bottom: 4px;
    }

    .setup-header .logo-emoji {
      font-size: 48px;
      display: block;
      margin-bottom: 8px;
      animation: floatBounce 3s ease-in-out infinite;
    }

    @keyframes floatBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .setup-subtitle { color: #666; font-size: 12px; }

    .section-label {
      color: #888;
      font-size: 13px;
      margin-bottom: 10px;
      display: block;
    }

    /* Character Grid */
    .char-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .char-card {
      background: #111;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .char-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, var(--role-glow, transparent) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .char-card:hover { border-color: #555; transform: translateY(-2px); }
    .char-card:hover::before { opacity: 0.1; }
    .char-card.selected { border-color: var(--role-color, #00ff00); background: #1a1a1a; }
    .char-card.selected::before { opacity: 0.15; }

    .char-card.selected .char-check {
      opacity: 1;
      transform: scale(1);
    }

    .char-check {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--role-color, #00ff00);
      color: #000;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0);
      transition: all 0.25s;
    }

    .char-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      transition: all 0.3s;
      position: relative;
    }

    .char-card.selected .char-avatar {
      box-shadow: 0 0 24px var(--role-glow, rgba(0,255,0,0.4));
      transform: scale(1.05);
    }

    .char-card:active .char-avatar {
      transform: scale(0.95);
    }

    .char-name { color: #fff; font-size: 14px; font-weight: 700; position: relative; }
    .char-title { color: #888; font-size: 11px; margin-top: 2px; position: relative; }
    .char-tag {
      color: #555;
      font-size: 10px;
      margin-top: 6px;
      font-style: italic;
      position: relative;
      background: #1a1a1a;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
    }

    /* Avatar color variants */
    .avatar-boss { background: linear-gradient(135deg, #ff4444, #cc0000); }
    .avatar-employee { background: linear-gradient(135deg, #ffcc00, #cc9900); }
    .avatar-pm { background: linear-gradient(135deg, #00cccc, #008888); }
    .avatar-hr { background: linear-gradient(135deg, #cc44ff, #8800aa); }
    .avatar-techlead { background: linear-gradient(135deg, #4488ff, #0044cc); }
    .avatar-intern { background: linear-gradient(135deg, #44ff44, #00aa00); }

    /* Meeting type & chaos */
    .option-row {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .option-group { flex: 1; min-width: 200px; }
    .option-group label { color: #888; font-size: 12px; display: block; margin-bottom: 6px; }
    .option-group select, .option-group input[type="range"] {
      width: 100%;
      background: #111;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13px;
    }
    .option-group select:focus { outline: none; border-color: #00ff00; }

    .chaos-display {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }

    .chaos-value { color: #00ff00; font-weight: 700; font-size: 13px; text-align: center; margin-top: 4px; }

    /* Start button */
    .start-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00aa00, #008800);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .start-btn:hover { background: linear-gradient(135deg, #00cc00, #00aa00); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,170,0,0.3); }
    .start-btn:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; box-shadow: none; }
    .start-btn-hint { color: #555; font-size: 11px; text-align: center; margin-top: 8px; }

    /* === MEETING VIEW === */
    /* Top participants bar */
    .participants-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #111;
      border-bottom: 1px solid #222;
      overflow-x: auto;
    }

    .participant-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #1a1a1a;
      border-radius: 16px;
      border: 1px solid #333;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .participant-chip.speaking {
      border-color: var(--chip-color, #555);
      box-shadow: 0 0 8px var(--chip-glow, transparent);
    }

    .participant-mini-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.5s;
      position: relative;
    }

    .participant-chip-name { font-size: 11px; color: #aaa; }

    /* Mood expression overlay */
    .mood-expression {
      position: absolute;
      top: -4px;
      right: -4px;
      font-size: 10px;
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    /* Mood glow animation */
    @keyframes moodPulse {
      0%, 100% { box-shadow: 0 0 8px var(--glow-color, transparent); }
      50% { box-shadow: 0 0 18px var(--glow-color, transparent); }
    }

    .participant-mini-avatar[data-mood="angry"] { --glow-color: rgba(255,0,0,0.6); animation: moodPulse 1.5s infinite; }
    .participant-mini-avatar[data-mood="smug"] { --glow-color: rgba(255,215,0,0.6); animation: moodPulse 1.5s infinite; }
    .participant-mini-avatar[data-mood="worried"] { --glow-color: rgba(255,165,0,0.5); animation: moodPulse 1.5s infinite; }
    .participant-mini-avatar[data-mood="submissive"] { --glow-color: rgba(100,100,255,0.4); animation: moodPulse 1.5s infinite; }
    .participant-mini-avatar[data-mood="excited"] { --glow-color: rgba(0,255,100,0.5); animation: moodPulse 1.5s infinite; }

    /* Chat area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scroll-behavior: smooth;
      min-height: 0;
    }

    /* Chat message - bubble style */
    .chat-msg {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      animation: fadeSlideIn 0.4s ease-out;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .msg-body {
      flex: 1;
      min-width: 0;
    }

    .msg-name {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg-title-tag {
      font-size: 10px;
      font-weight: 400;
      color: #555;
      background: #1a1a1a;
      padding: 1px 6px;
      border-radius: 3px;
    }

    .msg-bubble {
      font-size: 13px;
      color: #ddd;
      line-height: 1.6;
      padding: 10px 14px;
      background: #161616;
      border-radius: 4px 12px 12px 12px;
      border-left: 3px solid var(--msg-color, #333);
      position: relative;
      max-width: 85%;
    }

    /* User message - right aligned style */
    .chat-msg.user-msg {
      flex-direction: row-reverse;
    }

    .chat-msg.user-msg .msg-avatar { background: linear-gradient(135deg, #1a3a1a, #2a5a2a); }
    .chat-msg.user-msg .msg-name { color: #00ff00; justify-content: flex-end; }
    .chat-msg.user-msg .msg-bubble {
      background: #112211;
      border-left: none;
      border-right: 3px solid #00aa00;
      border-radius: 12px 4px 12px 12px;
      text-align: right;
    }

    /* Role color accents for msg-bubble */
    .msg-boss .msg-bubble { --msg-color: #ff4444; background: #1a1111; }
    .msg-employee .msg-bubble { --msg-color: #ffcc00; background: #1a1811; }
    .msg-pm .msg-bubble { --msg-color: #00cccc; background: #111a1a; }
    .msg-hr .msg-bubble { --msg-color: #cc44ff; background: #1a111a; }
    .msg-techlead .msg-bubble { --msg-color: #4488ff; background: #11141a; }
    .msg-intern .msg-bubble { --msg-color: #44ff44; background: #111a11; }

    /* Role colors for names */
    .name-boss { color: #ff4444; }
    .name-employee { color: #ffcc00; }
    .name-pm { color: #00cccc; }
    .name-hr { color: #cc44ff; }
    .name-techlead { color: #4488ff; }
    .name-intern { color: #44ff44; }

    /* Meeting event */
    .meeting-event {
      text-align: center;
      padding: 10px 20px;
      margin: 12px 0;
      color: #888;
      font-size: 12px;
      font-style: italic;
      background: linear-gradient(90deg, transparent, #111 20%, #111 80%, transparent);
      border-radius: 8px;
      border: 1px dashed #292929;
      animation: fadeSlideIn 0.4s ease-out;
      position: relative;
    }

    .meeting-event::before {
      content: '';
      position: absolute;
      left: 10%;
      right: 10%;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #333, transparent);
    }

    /* Entrance animation */
    .entrance-event {
      background: linear-gradient(90deg, transparent, #0a150a 20%, #0a150a 80%, transparent);
      border-color: #1a3a1a;
      color: #4a8a4a;
    }

    /* Gold quote */
    .gold-quote .msg-bubble {
      border-left: 3px solid #ffd700 !important;
      background: #1a1a11 !important;
      position: relative;
    }

    .gold-badge {
      display: inline-block;
      font-size: 10px;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      color: #000;
      padding: 1px 6px;
      border-radius: 3px;
      font-weight: 700;
      margin-left: 6px;
    }

    /* Floating reaction */
    .float-reaction {
      position: absolute;
      font-size: 18px;
      pointer-events: none;
      animation: floatUp 1.5s ease-out forwards;
      z-index: 50;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      align-items: center;
      animation: fadeSlideIn 0.3s ease-out;
    }

    .typing-dots { display: flex; gap: 4px; }
    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
      animation: typingBounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    .typing-name { font-size: 11px; color: #555; font-style: italic; }

    /* Score card overlay */
    .score-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .score-overlay.active { display: flex; }

    .score-card {
      background: #111;
      border: 2px solid #333;
      border-radius: 16px;
      padding: 28px;
      max-width: 440px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      animation: scorePopIn 0.3s ease-out;
    }

    @keyframes scorePopIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .score-card h3 {
      color: #ffd700;
      font-size: 18px;
      margin-bottom: 18px;
      text-align: center;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #1a1a1a;
      font-size: 13px;
    }
    .score-label { color: #888; }
    .score-value { color: #00ff00; font-weight: 700; }
    .score-value.highlight { color: #ff4444; }
    .score-value.warning { color: #ffcc00; }

    .score-stars {
      text-align: center;
      font-size: 28px;
      margin: 16px 0;
      letter-spacing: 4px;
    }

    .score-summary {
      text-align: center;
      color: #888;
      font-size: 13px;
      font-style: italic;
      margin: 10px 0;
      padding: 8px 16px;
      background: #0d0d0d;
      border-radius: 8px;
    }

    .score-gold {
      color: #ffd700;
      font-size: 12px;
      margin-top: 14px;
      padding: 10px 12px;
      background: #1a1a11;
      border-radius: 8px;
      border-left: 3px solid #ffd700;
      line-height: 1.5;
    }

    .score-participants {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .score-participant {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      background: #1a1a1a;
      border-radius: 12px;
      font-size: 11px;
    }

    .score-close {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      background: #222;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .score-close:hover { background: #333; }

    /* Input area */
    .input-area {
      padding: 12px 16px;
      border-top: 1px solid #222;
      background: #0d0d0d;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-area textarea {
      flex: 1;
      background: #111;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      resize: none;
      min-height: 40px;
      max-height: 100px;
      transition: border-color 0.2s;
    }
    .input-area textarea:focus { outline: none; border-color: #00aa00; box-shadow: 0 0 8px rgba(0,170,0,0.15); }
    .input-area textarea::placeholder { color: #444; }

    .send-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #00aa00, #008800);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .send-btn:hover { background: linear-gradient(135deg, #00cc00, #00aa00); box-shadow: 0 2px 12px rgba(0,170,0,0.3); }
    .send-btn:disabled { background: #222; color: #555; cursor: not-allowed; box-shadow: none; }

    /* Status bar */
    .status-bar {
      padding: 6px 16px;
      background: #111;
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #555;
    }

    .status-bar a { color: #00aa00; text-decoration: none; }
    .status-bar a:hover { text-decoration: underline; }
    .status-bar .sep { color: #444; margin: 0 6px; }

    .meeting-timer {
      color: #666;
      font-variant-numeric: tabular-nums;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .nav-link { font-size: 11px; padding: 8px 10px; }
      .terminal { width: 100%; margin: 0; height: calc(100vh - 40px); border-radius: 0; border: none; }
      .char-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      #setupView { padding: 16px; }
      .char-avatar { width: 56px; height: 56px; font-size: 26px; }
      .msg-bubble { max-width: 92%; }
    }
  </style>
</head>

<div class="terminal">
  <div class="terminal-header">
    <div class="terminal-buttons">
      <span class="terminal-btn close"></span>
      <span class="terminal-btn minimize"></span>
      <span class="terminal-btn maximize"></span>
    </div>
    <div class="terminal-title">PUA Meeting Room v0.8.0</div>
  </div>

  <!-- ====== SETUP VIEW ====== -->
  <div id="setupView" class="view active">
    <div class="setup-header">
      <span class="logo-emoji">🏢</span>
      <h2>职场会议室</h2>

<script>
// ==================== STATE ====================
const state = {
  selectedRoles: [],
  meetingType: 'emergency',
  chaosLevel: 2,
  messages: [],       // { role, name, content, mood }
  history: [],        // for API context
  lastRespondents: [],
  isSending: false,
  messageCount: 0,
  meetingStartTime: null,
  timerInterval: null,
};

const CHAR_INFO = {
  boss:     { name: '张总', title: '老板',   emoji: '👔', avatarClass: 'avatar-boss',     nameClass: 'name-boss',     color: '#ff4444', glow: 'rgba(255,68,68,0.3)' },
  employee: { name: '小王', title: '员工',   emoji: '😓', avatarClass: 'avatar-employee', nameClass: 'name-employee', color: '#ffcc00', glow: 'rgba(255,204,0,0.3)' },
  pm:       { name: '李姐', title: '产品经理', emoji: '📋', avatarClass: 'avatar-pm',       nameClass: 'name-pm',       color: '#00cccc', glow: 'rgba(0,204,204,0.3)' },
  hr:       { name: '陈姐', title: 'HR',     emoji: '💼', avatarClass: 'avatar-hr',       nameClass: 'name-hr',       color: '#cc44ff', glow: 'rgba(204,68,255,0.3)' },
  techlead: { name: '刘哥', title: '技术主管', emoji: '💻', avatarClass: 'avatar-techlead', nameClass: 'name-techlead', color: '#4488ff', glow: 'rgba(68,136,255,0.3)' },
  intern:   { name: '小赵', title: '实习生',  emoji: '🌱', avatarClass: 'avatar-intern',   nameClass: 'name-intern',   color: '#44ff44', glow: 'rgba(68,255,68,0.3)' },

// Mood emoji expressions
const MOOD_EMOJIS = {
  angry: '😤', smug: '😏', worried: '😰',
  submissive: '😣', excited: '😄', neutral: '',

// Role-specific typing verbs
const TYPING_VERBS = {

  employee: '正在小心翼翼地说',
  pm: '正在对齐需求',
  hr: '正在打感情牌',

  intern: '正在鼓起勇气发言',
};

// Expanded meeting events
const MEETING_EVENTS = [
  { text: '📱 张总的手机响了，他出去接电话了...', role: 'boss' },
  { text: '☕ 小赵打翻了咖啡！"对不起对不起！"', role: 'intern' },
  { text: '🦗 ...尴尬的沉默...大家互相看着...' },
  { text: '💥 李姐突然说："等等，需求变了"', role: 'pm' },
  { text: '📢 张总开始即兴演讲："想当年我创业的时候..."', role: 'boss' },
  { text: '💤 小王差点睡着了...', role: 'employee' },
  { text: '📝 小赵疯狂记笔记中...', role: 'intern' },
  { text: '🔥 刘哥和李姐吵起来了！', role: 'techlead' },
  { text: '🎂 陈姐突然提议："要不要团建？"', role: 'hr' },
  { text: '💻 刘哥打开了IDE开始写代码...', role: 'techlead' },
  { text: '🍜 有人的外卖到了，整个会议室都是味道...' },
  { text: '📊 李姐掏出了一个40页的PPT...', role: 'pm' },
  { text: '🤝 陈姐发起大家一起喊口号："加油！奋斗！"', role: 'hr' },
  { text: '⏰ 已经超时了，但张总还在说...', role: 'boss' },
  { text: '🔇 小王悄悄把手机调成了静音...', role: 'employee' },
  { text: '📎 刘哥发了一个技术方案链接，没人点开...', role: 'techlead' },
  { text: '🎤 张总开始念PPT上的文字...', role: 'boss' },
  { text: '😴 小赵眼皮开始打架了...', role: 'intern' },
  { text: '🗳️ 李姐发起投票，但只有她自己投了...', role: 'pm' },
  { text: '🍵 陈姐开始给每个人倒茶："来来来，喝口茶"', role: 'hr' },
  { text: '💡 小王刚要说什么就被张总打断了...', role: 'employee' },
  { text: '📞 投影仪突然坏了，大家松了口气...' },
  { text: '🎯 张总说了一个KPI，全场沉默...', role: 'boss' },
  { text: '🤔 刘哥在白板上画了一个架构图，越画越复杂...', role: 'techlead' },
];

// ==================== SETUP ====================
function toggleChar(card) {
  const role = card.dataset.role;
  card.classList.toggle('selected');

  if (card.classList.contains('selected')) {
    if (!state.selectedRoles.includes(role)) state.selectedRoles.push(role);
  } else {
    state.selectedRoles = state.selectedRoles.filter(r => r !== role);
  }

  updateStartButton();
}

function updateStartButton() {
  const btn = document.getElementById('startBtn');
  const hint = document.getElementById('startHint');
  const count = state.selectedRoles.length;

  if (count >= 2) {
    btn.disabled = false;
    hint.textContent = `已选 ${count} 人参会，准备开会！`;
  } else {
    btn.disabled = true;
    hint.textContent = `请至少选择 2 个参会角色（已选 ${count} 人）`;
  }
}

function updateChaosDisplay() {
  const val = parseInt(document.getElementById('chaosLevel').value);
  state.chaosLevel = val;
  const labels = { 1: '🧊 有序', 2: '🔥 标准', 3: '💥 混乱' };
  document.getElementById('chaosValue').textContent = labels[val];
}

// ==================== START MEETING ====================
function startMeeting() {
  state.meetingType = document.getElementById('meetingType').value;
  state.chaosLevel = parseInt(document.getElementById('chaosLevel').value);

  // Switch view
  document.getElementById('setupView').classList.remove('active');
  document.getElementById('meetingView').classList.add('active');

  // Build participants bar
  buildParticipantsBar();

  // Update status info
  const typeNames = {
    standup: '每日站会', brainstorm: '头脑风暴', review: '评审会议',
    retro: '回顾会议', planning: '规划会议', emergency: '紧急会议',
  };
  const chaosLabels = { 1: '有序', 2: '标准', 3: '混乱' };
  document.getElementById('meetingInfo').textContent =
    `${typeNames[state.meetingType]} | 混乱: ${chaosLabels[state.chaosLevel]} | ${state.selectedRoles.length}人`;

  // Start meeting timer
  state.meetingStartTime = Date.now();
  state.timerInterval = setInterval(updateTimer, 1000);

  // Welcome event
  addSystemMessage(`🏢 ${typeNames[state.meetingType]}开始了！`);

  // Entrance animations with staggered delay
  const participantNames = state.selectedRoles.map(r => CHAR_INFO[r].name);
  setTimeout(() => {
    addEntranceEvent(`${participantNames.join('、')} 和你进入了会议室`);
  }, 400);

  // Flavor text based on meeting type
  const flavorTexts = {
    standup: '张总看了看手表："开始吧，今天站会要高效。"',
    brainstorm: '"今天畅所欲言，但记住——我说了算。"',
    review: '所有人默默打开了笔记本电脑...',
    retro: '"上个迭代的问题，谁来说说？"',
    planning: '李姐打开了一个巨大的甘特图...',
    emergency: '🚨 气氛突然紧张了起来...',
  };
  setTimeout(() => {
    addSystemMessage(flavorTexts[state.meetingType] || '会议开始了。');
  }, 1200);

  // Focus input
  setTimeout(() => document.getElementById('msgInput').focus(), 500);
}

function updateTimer() {
  if (!state.meetingStartTime) return;
  const elapsed = Math.floor((Date.now() - state.meetingStartTime) / 1000);
  const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const secs = String(elapsed % 60).padStart(2, '0');
  document.getElementById('meetingTimer').textContent = `${mins}:${secs}`;
}

function buildParticipantsBar() {
  const bar = document.getElementById('participantsBar');
  bar.innerHTML = '';

  // Add user chip
  const userChip = document.createElement('div');
  userChip.className = 'participant-chip';
  userChip.innerHTML = `
    <div class="participant-mini-avatar" style="background:linear-gradient(135deg,#1a3a1a,#2a5a2a)">👤</div>
    <span class="participant-chip-name" style="color:#00ff00">你</span>
  `;
  bar.appendChild(userChip);

  // Add role chips
  for (const role of state.selectedRoles) {
    const info = CHAR_INFO[role];
    const chip = document.createElement('div');
    chip.className = 'participant-chip';
    chip.id = `chip-${role}`;
    chip.style.setProperty('--chip-color', info.color);
    chip.style.setProperty('--chip-glow', info.glow);
    chip.innerHTML = `
      <div class="participant-mini-avatar ${info.avatarClass}" id="avatar-${role}">${info.emoji}</div>
      <span class="participant-chip-name">${info.name}</span>
    `;
    bar.appendChild(chip);
  }
}

// ==================== CHAT ====================
function addSystemMessage(text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'meeting-event';
  div.textContent = text;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function addEntranceEvent(text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'meeting-event entrance-event';
  div.textContent = `🚪 ${text}`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function addUserMessage(text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'chat-msg user-msg';
  div.innerHTML = `
    <div class="msg-avatar" style="background:linear-gradient(135deg,#1a3a1a,#2a5a2a)">👤</div>
    <div class="msg-body">
      <div class="msg-name" style="color:#00ff00">你</div>
      <div class="msg-bubble" style="--msg-color:#00aa00">${escapeHtml(text)}</div>
    </div>
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function addRoleMessage(role, name, content, mood, isGold) {
  const info = CHAR_INFO[role];
  if (!info) return;

  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `chat-msg msg-${role}`;
  div.style.position = 'relative';

  const moodEmoji = MOOD_EMOJIS[mood] || '';
  const goldBadge = isGold ? '<span class="gold-badge">💎 金句</span>' : '';

  div.innerHTML = `
    <div class="msg-avatar ${info.avatarClass}">${info.emoji}</div>
    <div class="msg-body">
      <div class="msg-name ${info.nameClass}">
        ${name}
        <span class="msg-title-tag">${info.title}</span>
        ${moodEmoji ? `<span style="font-size:13px">${moodEmoji}</span>` : ''}
        ${goldBadge}
      </div>
      <div class="msg-bubble">${escapeHtml(content)}</div>
    </div>
  `;

  if (isGold) {
    div.classList.add('gold-quote');
  }

  area.appendChild(div);
  area.scrollTop = area.scrollHeight;

  // Update mood on participant chip
  const avatar = document.getElementById(`avatar-${role}`);
  if (avatar) {
    avatar.setAttribute('data-mood', mood || 'neutral');
    // Add mood expression mini-emoji
    const existing = avatar.querySelector('.mood-expression');
    if (existing) existing.remove();
    if (moodEmoji) {
      const moodEl = document.createElement('span');
      moodEl.className = 'mood-expression';
      moodEl.textContent = moodEmoji;
      avatar.appendChild(moodEl);
    }
  }

  // Brief "speaking" highlight on participant chip
  const chip = document.getElementById(`chip-${role}`);
  if (chip) {
    chip.classList.add('speaking');
    setTimeout(() => chip.classList.remove('speaking'), 2000);
  }

  // Float reaction for strong moods
  if (mood === 'angry' || mood === 'excited') {
    spawnFloatReaction(div, mood === 'angry' ? '💢' : '✨');
  }
}

function spawnFloatReaction(parentEl, emoji) {
  const reaction = document.createElement('div');
  reaction.className = 'float-reaction';
  reaction.textContent = emoji;
  reaction.style.left = (Math.random() * 40 + 30) + '%';
  reaction.style.top = '10px';
  parentEl.appendChild(reaction);
  setTimeout(() => reaction.remove(), 1600);
}

function showTypingIndicator(role) {
  const info = CHAR_INFO[role];
  if (!info) return null;

  const verb = TYPING_VERBS[role] || '正在发言';

  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.id = `typing-${role}`;
  div.innerHTML = `
    <div class="msg-avatar ${info.avatarClass}" style="width:30px;height:30px;font-size:15px">${info.emoji}</div>
    <div class="typing-dots"><span></span><span></span><span></span></div>
    <span class="typing-name">${info.name} ${verb}...</span>
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function removeTypingIndicator(role) {
  const el = document.getElementById(`typing-${role}`);
  if (el) el.remove();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ==================== SEND MESSAGE ====================
async function sendMeetingMessage() {
  const input = document.getElementById('msgInput');
  const message = input.value.trim();
  if (!message || state.isSending) return;

  // Handle commands
  if (message === '/score') {
    input.value = '';
    showScoreCard();
    return;
  }
  if (message === '/exit') {
    input.value = '';
    endMeeting();
    return;
  }
  if (message === '/help') {
    input.value = '';
    addSystemMessage('命令: /score 评分卡 | /exit 结束会议 | /help 帮助');
    return;
  }

  state.isSending = true;
  input.value = '';
  document.getElementById('meetingSendBtn').disabled = true;

  // Add user message
  addUserMessage(message);
  state.messages.push({ role: 'user', content: message });
  state.messageCount++;

  // Maybe trigger a random event (12% chance)
  if (Math.random() < 0.12) {
    const relevantEvents = MEETING_EVENTS.filter(
      e => !e.role || state.selectedRoles.includes(e.role)
    );
    if (relevantEvents.length > 0) {
      const event = relevantEvents[Math.floor(Math.random() * relevantEvents.length)];
      setTimeout(() => addSystemMessage(event.text), 600);
    }
  }

  try {
    // Build history for API (keep last 6 exchanges)
    const apiHistory = state.history.slice(-6);

    const response = await fetch('/api/meeting', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message,
        participants: state.selectedRoles,
        meetingType: state.meetingType,
        chaosLevel: state.chaosLevel,
        history: apiHistory,
        lastRespondents: state.lastRespondents,
      }),
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error || `请求失败 (${response.status})`);
    }

    const data = await response.json();

    if (!data.responses || data.responses.length === 0) {
      throw new Error('没有角色回复');
    }

    // Add user message to history BEFORE AI responses (correct ordering)
    state.history.push({ role: 'user', content: message });

    // Display responses with staggered delays
    state.lastRespondents = data.responses.map(r => r.role);

    // Determine if any response is a "gold quote" (longest one)
    let longestIdx = 0;
    let longestLen = 0;
    data.responses.forEach((r, i) => {
      if (r.content.length > longestLen) {
        longestLen = r.content.length;
        longestIdx = i;
      }
    });
    const isGoldQuote = longestLen > 40 && data.responses.length >= 2;

    for (let i = 0; i < data.responses.length; i++) {
      const r = data.responses[i];

      // Show typing indicator first
      showTypingIndicator(r.role);

      // Staggered delay: 800ms + random 200-800ms per message
      await sleep(800 + Math.random() * 600);

      removeTypingIndicator(r.role);
      addRoleMessage(r.role, r.name, r.content, r.mood, isGoldQuote && i === longestIdx);

      // Track in state
      state.messages.push({ role: r.role, name: r.name, content: r.content, mood: r.mood });
      state.history.push({ role: 'assistant', content: `[${r.name}]: ${r.content}` });
    }

    // Cap arrays to prevent unbounded memory growth
    if (state.messages.length > 200) state.messages = state.messages.slice(-200);
    if (state.history.length > 20) state.history = state.history.slice(-20);

  } catch (err) {
    addSystemMessage(`⚠️ ${err.message || '发送失败，请稍后重试'}`);
  }

  state.isSending = false;
  document.getElementById('meetingSendBtn').disabled = false;
  document.getElementById('msgInput').focus();
}

function handleMeetingKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMeetingMessage();
  }
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// ==================== SCORE CARD ====================
function showScoreCard() {
  if (state.messages.length === 0) {
    addSystemMessage('还没有消息记录，先发几条消息再看评分吧！');
    return;
  }

  const card = generateScoreCard();
  const container = document.getElementById('scoreCardContent');

  const starStr = '★'.repeat(card.rating) + '☆'.repeat(5 - card.rating);

  // Meeting duration
  let durationStr = '--';
  if (state.meetingStartTime) {
    const elapsed = Math.floor((Date.now() - state.meetingStartTime) / 1000);
    const mins = Math.floor(elapsed / 60);
    const secs = elapsed % 60;
    durationStr = `${mins}分${secs}秒`;
  }

  // Build per-role stats
  let participantChips = '';
  for (const role of state.selectedRoles) {
    const info = CHAR_INFO[role];
    const count = card.roleCounts[role] || 0;
    participantChips += `<div class="score-participant"><span>${info.emoji}</span><span>${info.name}: ${count}条</span></div>`;
  }

  container.innerHTML = `
    <h3>📊 会议评分卡</h3>
    <div class="score-row"><span class="score-label">会议时长</span><span class="score-value">${escapeHtml(durationStr)}</span></div>
    <div class="score-row"><span class="score-label">总消息数</span><span class="score-value">${card.totalMessages}</span></div>
    <div class="score-row"><span class="score-label">🎂 画饼次数</span><span class="score-value highlight">${card.cakePaintCount}次</span></div>
    <div class="score-row"><span class="score-label">🗣️ 黑话密度</span><span class="score-value warning">${card.jargonDensity}%</span></div>
    <div class="score-row"><span class="score-label">✅ 有效决策</span><span class="score-value">${card.effectiveDecisions}个</span></div>
    <div class="score-row"><span class="score-label">🤚 打断次数</span><span class="score-value">${card.interruptCount}次</span></div>
    <div class="score-row"><span class="score-label">🏆 最活跃</span><span class="score-value">${escapeHtml(card.topContributor)}</span></div>
    <div class="score-stars">${starStr}</div>
    <div class="score-summary">"${escapeHtml(card.summary)}"</div>
    <div class="score-participants">${participantChips}</div>
    ${card.goldQuote ? `<div class="score-gold">💎 金句: ${escapeHtml(card.goldQuote)}</div>` : ''}
    <button class="score-close" onclick="closeScoreCard()">继续开会</button>
  `;

  document.getElementById('scoreOverlay').classList.add('active');
}

function closeScoreCard() {
  document.getElementById('scoreOverlay').classList.remove('active');
}

function generateScoreCard() {
  const CAKE_KW = ['期权','股权','未来','前景','发展空间','上市','格局','赋能','抓手','闭环','对齐','大饼','潜力','机会','平台','成长','当年','画饼'];
  const JARGON_KW = ['赋能','对齐','闭环','抓手','颗粒度','打通','底层逻辑','顶层设计','组合拳','方法论','链路','漏斗','触达','心智','拉通','沉淀','复盘','MVP','PMF','ROI','OKR','KPI'];

  const roleCounts = {};
  let cakeCount = 0, jargonCount = 0, totalChars = 0, interruptCount = 0;
  let longestMsg = '', longestRole = '';

  for (const msg of state.messages) {
    if (msg.role === 'user') continue;
    roleCounts[msg.role] = (roleCounts[msg.role] || 0) + 1;
    totalChars += msg.content.length;

    for (const kw of CAKE_KW) { if (msg.content.includes(kw)) cakeCount++; }
    for (const kw of JARGON_KW) { if (msg.content.includes(kw)) jargonCount++; }
    if (msg.content.includes('等等') || msg.content.includes('我说') || msg.content.includes('打断')) interruptCount++;

    if (msg.content.length > longestMsg.length) {
      longestMsg = msg.content;
      longestRole = msg.name || CHAR_INFO[msg.role]?.name || msg.role;
    }
  }

  let topRole = '', topCount = 0;
  for (const [role, count] of Object.entries(roleCounts)) {
    if (count > topCount) { topCount = count; topRole = role; }
  }
  const topName = CHAR_INFO[topRole]?.name || topRole;

  const jargonDensity = totalChars > 0 ? Math.min(100, Math.round((jargonCount / (totalChars / 20)) * 100)) : 0;
  const totalMsgs = state.messages.filter(m => m.role !== 'user').length;
  const rating = Math.max(1, Math.min(5, 5 - Math.floor(cakeCount / 3) - Math.floor(interruptCount / 2)));

  const summaries = [
    '又一场可以用邮件代替的会议',
    '会议很成功，什么都没决定',
    '时间管理大师们的聚会',
    '黑话浓度超标，请打开窗户',
    '有效信息密度约等于零',
    '一场精彩的职场大戏',
    '恭喜你，又浪费了一段人生',
    '这场会议的含金量不如茶水间八卦',
  ];

  return {
    totalMessages: totalMsgs,
    roleCounts,
    cakePaintCount: cakeCount,
    jargonDensity,
    effectiveDecisions: 0,
    interruptCount,
    topContributor: `${topName}(${topCount}条)`,
    goldQuote: longestMsg ? `${longestRole}: "${longestMsg}"` : null,
    rating,
    summary: summaries[Math.floor(Math.random() * summaries.length)],
  };
}

// ==================== END MEETING ====================
function endMeeting() {
  showScoreCard();
}

// Close overlay on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeScoreCard();
});

// Close overlay on background click
document.getElementById('scoreOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeScoreCard();
});
</script>
