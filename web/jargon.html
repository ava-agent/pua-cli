<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>职场黑话生成器 - PUA CLI</title>
  <meta name="description" content="职场黑话生成器 - 让你的表达更有职场范儿，黑话词库浏览与文本翻译">
  <meta property="og:title" content="职场黑话生成器 - PUA CLI">
  <meta property="og:description" content="一键生成职场黑话，支持会议、报告、邮件、聊天四种场景">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗣️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      background: #0a0a0a;
      min-height: 100vh;
      overflow-x: hidden;
      color: #e0e0e0;
    }

    /* === Terminal Shell === */
    .terminal {
      width: 90%;
      max-width: 900px;
      margin: 30px auto 40px;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      overflow: hidden;
    }

    .terminal-header {
      padding: 10px 16px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #333;
    }

    .terminal-buttons { display: flex; gap: 8px; }
    .terminal-btn { width: 12px; height: 12px; border-radius: 50%; }
    .terminal-btn.close { background: #ff5f56; }
    .terminal-btn.minimize { background: #ffbd2e; }
    .terminal-btn.maximize { background: #27ca3f; }

    .terminal-title { color: #888; font-size: 12px; flex: 1; text-align: center; }

    .terminal-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      overflow-x: hidden;
      background: #0a0a0a;
      scroll-behavior: smooth;
      min-height: 0;
    }

    .terminal-body::-webkit-scrollbar { width: 8px; }
    .terminal-body::-webkit-scrollbar-track { background: #0a0a0a; }
    .terminal-body::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    .terminal-body::-webkit-scrollbar-thumb:hover { background: #444; }

    /* === Nav Bar === */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #111;
      border-bottom: 1px solid #222;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .nav-bar::-webkit-scrollbar { height: 0; }
    .nav-link {
      color: #666;
      text-decoration: none;
      font-size: 12px;
      padding: 10px 14px;
      white-space: nowrap;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
      flex-shrink: 0;
    }
    .nav-link:hover {
      color: #ccc;
      background: #1a1a1a;
    }
    .nav-link.active {
      color: #00ccff;
      border-bottom-color: #00ccff;
    }

    /* === Setup Area === */
    .setup-area {
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; }
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #00ccff, #4488ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-subtitle {
      color: #666;
      font-size: 12px;
      margin-bottom: 24px;
    }

    /* === Mode Tabs === */
    .mode-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 24px;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }

    .mode-tab {
      flex: 1;
      padding: 12px 16px;
      background: #111;
      color: #666;
      font-family: inherit;
      font-size: 13px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .mode-tab:first-child { border-right: 1px solid #333; }

    .mode-tab:hover {
      color: #00ccff;
      background: #0a1520;
    }

    .mode-tab.active {
      color: #00ccff;
      background: #0a1a2a;
      font-weight: 700;
    }

    /* === Mode Panels === */
    .mode-panel { display: none; }
    .mode-panel.active { display: block; }

    /* === Section Labels === */
    .section-label {
      color: #888;
      font-size: 12px;
      margin-bottom: 10px;
      display: block;
    }

    /* === Type Cards (2x2 Grid) === */
    .type-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .type-card {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      position: relative;
    }

    .type-card:hover {
      border-color: #00ccff;
      background: #0a1520;
      box-shadow: 0 0 16px rgba(0, 204, 255, 0.08);
    }

    .type-card.selected {
      border-color: #00ccff;
      background: #0a1a2a;
      box-shadow: 0 0 20px rgba(0, 204, 255, 0.12);
    }

    .type-card.selected::after {
      content: '\2713';
      position: absolute;
      top: 8px;
      right: 10px;
      color: #00ccff;
      font-size: 14px;
      font-weight: 700;
    }

    .type-card .emoji { font-size: 24px; margin-bottom: 6px; }
    .type-card .name { color: #ddd; font-size: 13px; font-weight: 500; }
    .type-card .desc { color: #555; font-size: 10px; margin-top: 4px; }

    /* === Intensity Selector === */
    .intensity-options {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .intensity-btn {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-family: inherit;
      font-size: 12px;
      color: #888;
    }

    .intensity-btn:hover { border-color: #00ccff; color: #00ccff; }

    .intensity-btn.selected {
      border-color: #00ccff;
      background: #0a1a2a;
      color: #00ccff;
      font-weight: 700;
    }

    /* === Generate Button === */
    .generate-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0088cc, #00aaff);
      border: none;
      border-radius: 8px;
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }

    .generate-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0, 170, 255, 0.3);
    }

    .generate-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* === Result Area === */
    .result-area {
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    .result-area.visible { display: block; }

    .result-section-title {
      color: #00ccff;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* === Jargon Tags === */
    .jargon-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .jargon-tag {
      background: #1a2a3a;
      border: 1px solid #00ccff;
      color: #00ccff;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-family: inherit;
      transition: all 0.2s;
      cursor: default;
      animation: tagIn 0.3s ease-out backwards;
    }

    .jargon-tag:hover {
      background: #0a3050;
      box-shadow: 0 0 10px rgba(0, 204, 255, 0.2);
    }

    @keyframes tagIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    /* === Example Sentence Box === */
    .example-box {
      background: #111;
      border: 1px solid #333;
      border-left: 3px solid #00ccff;
      border-radius: 4px 8px 8px 4px;
      padding: 14px 18px;
      margin-bottom: 20px;
      color: #ccc;
      font-size: 13px;
      line-height: 1.6;
    }

    .example-box .example-label {
      color: #00ccff;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: block;
    }

    /* === Translation Panel === */
    .translate-input {
      width: 100%;
      min-height: 100px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 14px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      margin-bottom: 16px;
      transition: border-color 0.2s;
      line-height: 1.6;
    }

    .translate-input:focus {
      outline: none;
      border-color: #00ccff;
      box-shadow: 0 0 8px rgba(0, 204, 255, 0.15);
    }

    .translate-input::placeholder { color: #444; }

    /* === Translation Comparison === */
    .translation-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .compare-panel {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 14px;
    }

    .compare-panel .compare-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: block;
    }

    .compare-panel.original .compare-label { color: #888; }
    .compare-panel.translated .compare-label { color: #00ccff; }

    .compare-panel.translated {
      border-color: #00ccff;
      background: #0a1520;
    }

    .compare-text {
      color: #ccc;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }

    /* === Action Buttons (Bottom) === */
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .action-btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .action-btn.regenerate {
      background: #111;
      border: 1px solid #333;
      color: #888;
    }

    .action-btn.regenerate:hover {
      border-color: #00ccff;
      color: #00ccff;
      background: #0a1520;
    }

    .action-btn.copy {
      background: #0a1a2a;
      border: 1px solid #00ccff;
      color: #00ccff;
    }

    .action-btn.copy:hover {
      background: #0a3050;
      box-shadow: 0 0 12px rgba(0, 204, 255, 0.2);
    }

    .action-btn.copy.copied {
      background: #0a2a1a;
      border-color: #00ff88;
      color: #00ff88;
    }

    /* === Toast === */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a2a3a;
      border: 1px solid #00ccff;
      color: #00ccff;
      padding: 10px 24px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      opacity: 0;
      transition: all 0.3s ease-out;
      pointer-events: none;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* === Status Bar === */
    .status-bar {
      background: #1a1a1a;
      padding: 6px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #333;
      font-size: 11px;
    }

    .status-bar .left { color: #00ccff; }

    .status-bar .right {
      color: #666;
      display: flex;
      align-items: center;
      gap: 0;
    }

    .status-bar a {
      color: #00ccff;
      text-decoration: none;
      transition: color 0.2s;
    }

    .status-bar a:hover { color: #00ffff; }

    .status-bar .sep { color: #444; margin: 0 6px; }

    /* === Responsive === */
    @media (max-width: 600px) {
      .terminal {
        width: 95%;
        margin: 10px auto;
        height: calc(100vh - 20px);
      }

      .terminal-body { padding: 12px; }

      .type-grid { grid-template-columns: 1fr; }

      .intensity-options { flex-direction: column; }

      .translation-compare {
        grid-template-columns: 1fr;
      }

      .nav-link { font-size: 11px; padding: 8px 10px; }

      .status-bar {
        flex-direction: column;
        gap: 4px;
        align-items: flex-start;
      }

      .page-title { font-size: 18px; }
    }
  </style>
</head>

        'OKR', 'KPI', 'GMV', 'DAU', 'MAU',
        '转化', '留存', '促活', '召回', '裂变', '传播',
        '痛点', '爽点', '场景', '案例', '方法论', '最佳实践'
      ]
    };

    const TYPE_NAMES = {
      meeting: '会议',
      report: '报告',
      email: '邮件',
      chat: '聊天'
    };

    // ================================================
    // State
    // ================================================
    let selectedType = null;
    let dictIntensity = 'medium';
    let translateIntensity = 'medium';
    let currentMode = 'dictionary';
    let lastDictResult = null;
    let lastTranslateResult = null;

    // ================================================
    // Elements
    // ================================================
    const tabDictionary = document.getElementById('tabDictionary');
    const tabTranslate = document.getElementById('tabTranslate');
    const panelDictionary = document.getElementById('panelDictionary');
    const panelTranslate = document.getElementById('panelTranslate');
    const typeGrid = document.getElementById('typeGrid');
    const generateBtn = document.getElementById('generateBtn');
    const generateHint = document.getElementById('generateHint');
    const dictResult = document.getElementById('dictResult');
    const jargonTags = document.getElementById('jargonTags');
    const exampleText = document.getElementById('exampleText');
    const translateInput = document.getElementById('translateInput');
    const translateBtn = document.getElementById('translateBtn');
    const translateResult = document.getElementById('translateResult');
    const originalText = document.getElementById('originalText');
    const translatedText = document.getElementById('translatedText');
    const toastEl = document.getElementById('toast');

    // ================================================
    // Mode Switching
    // ================================================
    tabDictionary.addEventListener('click', () => switchMode('dictionary'));
    tabTranslate.addEventListener('click', () => switchMode('translate'));

    function switchMode(mode) {
      currentMode = mode;

      tabDictionary.classList.toggle('active', mode === 'dictionary');
      tabTranslate.classList.toggle('active', mode === 'translate');
      panelDictionary.classList.toggle('active', mode === 'dictionary');
      panelTranslate.classList.toggle('active', mode === 'translate');
    }

    // ================================================
    // Type Selection
    // ================================================
    typeGrid.addEventListener('click', (e) => {
      const card = e.target.closest('.type-card');
      if (!card) return;

      document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedType = card.dataset.type;

      generateBtn.disabled = false;
      generateHint.style.display = 'none';
    });

    // ================================================
    // Intensity Selection (Dictionary)
    // ================================================
    document.getElementById('intensityOptions').addEventListener('click', (e) => {
      const btn = e.target.closest('.intensity-btn');
      if (!btn) return;

      document.querySelectorAll('#intensityOptions .intensity-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      dictIntensity = btn.dataset.intensity;
    });

    // ================================================
    // Intensity Selection (Translate)
    // ================================================
    document.getElementById('translateIntensityOptions').addEventListener('click', (e) => {
      const btn = e.target.closest('.intensity-btn');
      if (!btn) return;

      document.querySelectorAll('#translateIntensityOptions .intensity-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      translateIntensity = btn.dataset.intensity;
    });

    // ================================================
    // Dictionary Generation
    // ================================================
    generateBtn.addEventListener('click', generateDictionary);
    document.getElementById('regenerateDict').addEventListener('click', generateDictionary);

    async function generateDictionary() {
      if (!selectedType) return;

      const allWords = JARGON_DICT[selectedType];
      if (!allWords || allWords.length === 0) return;

      // Determine count based on intensity
      let count;
      switch (dictIntensity) {
        case 'light': count = 5; break;
        case 'medium': count = 10; break;
        case 'heavy': count = allWords.length; break;
        default: count = 10;
      }

      // Get words (shuffle for variety, then take the slice)
      const shuffled = shuffleArray([...allWords]);
      const selectedWords = shuffled.slice(0, Math.min(count, allWords.length));

      // Render jargon tags
      jargonTags.innerHTML = '';
      selectedWords.forEach((word, index) => {
        const tag = document.createElement('span');
        tag.className = 'jargon-tag';
        tag.textContent = word;
        tag.style.animationDelay = `${index * 0.05}s`;
        jargonTags.appendChild(tag);
      });

      // Show result area with loading state for the sentence
      exampleText.textContent = '生成中...';
      dictResult.classList.add('visible');

      // Set loading state on buttons
      const regenerateDict = document.getElementById('regenerateDict');
      generateBtn.disabled = true;
      regenerateDict.disabled = true;
      const prevBtnText = generateBtn.textContent;
      generateBtn.textContent = '生成中...';

      try {
        const response = await fetch('/api/jargon', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mode: 'generate',
            input: selectedType,
            scene: selectedType
          })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => null);
          throw new Error(errorData?.error || `请求失败 (${response.status})`);
        }

        const data = await response.json();
        const sentence = data.result || '';
        exampleText.textContent = sentence;

        // Store result for copy
        lastDictResult = {
          type: TYPE_NAMES[selectedType],
          words: selectedWords,
          sentence: sentence
        };
      } catch (error) {
        exampleText.textContent = '生成失败，请重试';
        showToast(error.message || '网络错误，请稍后重试');
      } finally {
        generateBtn.disabled = false;
        regenerateDict.disabled = false;
        generateBtn.textContent = prevBtnText;
      }

      // Scroll to result
      requestAnimationFrame(() => {
        dictResult.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    }

    // ================================================
    // Text Translation
    // ================================================
    translateBtn.addEventListener('click', translateText);
    document.getElementById('regenerateTranslate').addEventListener('click', translateText);

    async function translateText() {
      const input = translateInput.value.trim();
      if (!input) {
        showToast('请先输入要翻译的文本');
        return;
      }

      // Set loading state
      const regenerateTranslate = document.getElementById('regenerateTranslate');
      translateBtn.disabled = true;
      regenerateTranslate.disabled = true;
      const prevBtnText = translateBtn.textContent;
      translateBtn.textContent = '翻译中...';

      try {
        const response = await fetch('/api/jargon', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mode: 'translate',
            input: input
          })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => null);
          throw new Error(errorData?.error || `请求失败 (${response.status})`);
        }

        const data = await response.json();
        const result = data.result || '';

        // Display result
        originalText.textContent = input;
        translatedText.textContent = result;

        lastTranslateResult = result;

        // Show result
        translateResult.classList.add('visible');

        // Scroll to result
        requestAnimationFrame(() => {
          translateResult.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
      } catch (error) {
        showToast(error.message || '网络错误，请稍后重试');
      } finally {
        translateBtn.disabled = false;
        regenerateTranslate.disabled = false;
        translateBtn.textContent = prevBtnText;
      }
    }

    // ================================================
    // Copy Functions
    // ================================================
    document.getElementById('copyDict').addEventListener('click', () => {
      if (!lastDictResult) return;

      const text = `【${lastDictResult.type}黑话】\n`
        + `词汇：${lastDictResult.words.join('、')}\n`
        + `例句：${lastDictResult.sentence}`;

      copyToClipboard(text, document.getElementById('copyDict'));
    });

    document.getElementById('copyTranslate').addEventListener('click', () => {
      if (!lastTranslateResult) return;
      copyToClipboard(lastTranslateResult, document.getElementById('copyTranslate'));
    });

    function copyToClipboard(text, btnEl) {
      navigator.clipboard.writeText(text).then(() => {
        btnEl.classList.add('copied');
        btnEl.textContent = '✓ 已复制';
        showToast('已复制到剪贴板');
        setTimeout(() => {
          btnEl.classList.remove('copied');
          btnEl.textContent = '📋 复制全部';
        }, 2000);
      }).catch(() => {
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          btnEl.classList.add('copied');
          btnEl.textContent = '✓ 已复制';
          showToast('已复制到剪贴板');
          setTimeout(() => {
            btnEl.classList.remove('copied');
            btnEl.textContent = '📋 复制全部';
          }, 2000);
        } catch (err) {
          showToast('复制失败，请手动复制');
        }
        document.body.removeChild(textarea);
      });
    }

    // ================================================
    // Toast
    // ================================================
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2000);
    }

    // ================================================
    // Utilities
    // ================================================
    function shuffleArray(arr) {
      const result = [...arr];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = result[i];
        result[i] = result[j];
        result[j] = temp;
      }
      return result;
    }

    // ================================================
    // Keyboard Shortcuts
    // ================================================
    document.addEventListener('keydown', (e) => {
      // Enter to generate/translate when focused on translate input
      if (e.key === 'Enter' && !e.shiftKey && document.activeElement === translateInput) {
        e.preventDefault();
        translateText();
      }
    });
  </script>
</body>
</html>
