  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>

    }

    /* === Nav Bar === */
    .nav-bar {

      top: 0;

      white-space: nowrap;

      border-bottom: 2px solid transparent;

    .nav-link:hover {
      color: #ccc;
      background: #1a1a1a;
    }

    .nav-link.active {

    /* === Terminal Shell === */
    .terminal {
      width: 90%;
      max-width: 900px;
      margin: 30px auto 40px;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .terminal-header {
      padding: 10px 16px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #333;
    }

    .terminal-buttons { display: flex; gap: 8px; }
    .terminal-btn { width: 12px; height: 12px; border-radius: 50%; }
    .terminal-btn.close { background: #ff5f56; }
    .terminal-btn.minimize { background: #ffbd2e; }
    .terminal-btn.maximize { background: #27ca3f; }
    .terminal-title { color: #888; font-size: 12px; flex: 1; text-align: center; }

    .terminal-body {
      padding: 24px;
      overflow-y: auto;
      background: #0a0a0a;
    }

    .terminal-body::-webkit-scrollbar { width: 8px; }
    .terminal-body::-webkit-scrollbar-track { background: #0a0a0a; }
    .terminal-body::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    .terminal-body::-webkit-scrollbar-thumb:hover { background: #444; }

    /* === Setup Header === */
    .setup-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .setup-header .logo-emoji {
      font-size: 48px;
      display: block;
      margin-bottom: 8px;
      animation: floatBounce 3s ease-in-out infinite;
    }

    @keyframes floatBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .setup-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #00ccff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .setup-subtitle {
      color: #666;
      font-size: 12px;
    }

    /* === Section Labels === */
    .section-label {
      color: #888;
      font-size: 13px;
      margin-bottom: 12px;
      display: block;
    }

    /* === Role Grid === */
    .role-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .role-card {
      background: #111;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      user-select: none;
      position: relative;
    }

    .role-card:hover {
      border-color: #555;
      transform: translateY(-2px);
    }

    .role-card.selected {
      border-color: #00ccff;
      background: #0a1a2a;
      box-shadow: 0 0 20px rgba(0, 204, 255, 0.15);
    }

    .role-card.selected .role-check {
      opacity: 1;
      transform: scale(1);
    }

    .role-check {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #00ccff;
      color: #000;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0);
      transition: all 0.25s;
    }

    .role-emoji {
      font-size: 32px;
      margin-bottom: 6px;
    }

    .role-name {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .role-desc {
      color: #666;
      font-size: 10px;
      margin-top: 4px;
    }

    /* === Week Selector === */
    .week-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .week-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #111;
      border: 1px solid #333;
      color: #00ccff;
      font-size: 18px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .week-btn:hover {
      border-color: #00ccff;
      background: #0a1a2a;
    }

    .week-display {
      font-size: 16px;
      color: #e0e0e0;
      min-width: 120px;
      text-align: center;
    }

    .week-display .number {
      color: #00ccff;
      font-weight: 700;
      font-size: 20px;
    }

    /* === Generate Button === */
    .generate-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0088cc, #00aaff);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;

    .generate-btn:hover {
      background: linear-gradient(135deg, #00aaff, #00ccff);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0, 204, 255, 0.3);
    }

    .generate-btn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .generate-hint {
      color: #555;
      font-size: 11px;
      text-align: center;

    /* === Report Container === */
    .report-container {
      display: none;
      animation: fadeSlideIn 0.4s ease-out;
    }

    .report-container.visible {
      display: block;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === Report Box === */
    .report-box {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;

    .report-title {

    .report-section-title.plans { color: #ffcc00; }
    .report-section-title.risks { color: #ff4444; }

    .report-item .ordinal {

      margin-right: 6px;

    .action-buttons {

    .action-btn.copy:hover {

    .action-btn.copy.copied {

    }

    .action-btn.regenerate {

      border: 1px solid #333;

    .action-btn.regenerate:hover {
      border-color: #666;
      color: #ccc;

    /* === Status Bar === */
    .status-bar {
      padding: 6px 16px;
      background: #111;
      border-top: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;

    .status-bar .left { color: #00ccff; }
    .status-bar .right { color: #666; }
    .status-bar a { color: #00ccff; text-decoration: none; transition: color 0.2s; }
    .status-bar a:hover { color: #00ffff; }
    .status-bar .sep { color: #444; margin: 0 6px; }

    /* === Work Items Textarea === */
    .work-items-input {
      width: 100%;
      min-height: 80px;
      max-height: 160px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 14px;
      color: #e0e0e0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;

      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 28px;
    }
    .work-items-input:focus { border-color: #00ccff; }
    .work-items-input::placeholder { color: #444; }

    /* === Report Body (AI response) === */
    .report-body {
      color: #b8b8b8;

      line-height: 1.8;

    /* === Responsive === */

        flex-direction: column;
        gap: 4px;

      }
    }
  </style>

<script>
// ==================== DATA ====================
const ROLE_NAMES = {
  boss: '老板',
  employee: '员工',
  pm: '产品经理',
  hr: 'HR',
  techlead: '技术主管',
  intern: '实习生'
};

const CHINESE_ORDINALS = ['一', '二', '三', '四', '五'];

// ==================== STATE ====================
let selectedRole = null;
let currentWeek = getWeekNumber(new Date());
let isGenerating = false;
let lastReportText = '';

// ==================== WEEK CALCULATION ====================
function getWeekNumber(date) {
  const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
  const pastDaysOfYear = (date.getTime() - firstDayOfYear.getTime()) / 86400000;
  return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
}

// ==================== HELPERS ====================
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ==================== API CALL ====================
async function callWeeklyApi(role, workItems, weekNumber) {
  const response = await fetch('/api/weekly', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ role, workItems, weekNumber })
  });

  if (!response.ok) {
    const errorData = await response.json().catch(() => null);
    const message = (errorData && errorData.error) || `请求失败 (${response.status})`;
    throw new Error(message);
  }

  const data = await response.json();
  return data.result;
}

// ==================== GENERATION ====================
async function handleGenerate() {
  if (!selectedRole || isGenerating) return;

  const workItemsInput = document.getElementById('workItemsInput');
  const workItems = workItemsInput.value.trim();
  if (!workItems) return;

  const generateBtn = document.getElementById('generateBtn');
  const regenerateBtn = document.getElementById('regenerateBtn');

  // Set loading state
  isGenerating = true;
  generateBtn.disabled = true;
  generateBtn.textContent = '生成中...';
  regenerateBtn.disabled = true;

  try {
    const resultText = await callWeeklyApi(selectedRole, workItems, currentWeek);
    lastReportText = resultText;
    renderReport(selectedRole, currentWeek, resultText);
  } catch (err) {
    showError(err.message || '生成失败，请稍后重试');
  } finally {
    isGenerating = false;
    generateBtn.textContent = '生成周报';
    regenerateBtn.disabled = false;
    updateGenerateButton();
  }
}

function showError(message) {
  const errorDiv = document.createElement('div');
  errorDiv.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#331111;border:1px solid #ff4444;color:#ff6666;padding:12px 24px;border-radius:8px;font-family:inherit;font-size:13px;z-index:9999;animation:fadeSlideIn 0.3s ease-out;';
  errorDiv.textContent = message;
  document.body.appendChild(errorDiv);
  setTimeout(() => {
    errorDiv.style.opacity = '0';
    errorDiv.style.transition = 'opacity 0.3s';
    setTimeout(() => document.body.removeChild(errorDiv), 300);
  }, 3000);
}

function renderReport(role, week, text) {
  const reportBox = document.getElementById('reportBox');
  const roleName = ROLE_NAMES[role] || role;

  reportBox.innerHTML = `
    <div class="report-header">
      <div class="report-title">周报 - ${escapeHtml(roleName)} - 第${week}周</div>
      <div class="report-meta">生成时间: ${new Date().toLocaleString('zh-CN')}</div>
    </div>
    <div class="report-body">${escapeHtml(text)}</div>
  `;

  const container = document.getElementById('reportContainer');
  container.classList.remove('visible');
  // Trigger reflow for animation
  void container.offsetWidth;
  container.classList.add('visible');

  // Scroll to report
  requestAnimationFrame(() => {
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

// ==================== COPY TO CLIPBOARD ====================
function getReportPlainText() {
  const reportBox = document.getElementById('reportBox');
  const titleEl = reportBox.querySelector('.report-title');
  const bodyEl = reportBox.querySelector('.report-body');

  if (!titleEl || !bodyEl) return '';

  const title = titleEl.textContent;
  let text = title + '\n';
  text += '='.repeat(title.length * 2) + '\n\n';
  text += bodyEl.textContent;

  return text.trim();
}

// ==================== INIT ====================
function init() {
  // Set week display
  updateWeekDisplay();

  const workItemsInput = document.getElementById('workItemsInput');

  // Role selection
  const roleGrid = document.getElementById('roleGrid');
  roleGrid.addEventListener('click', (e) => {
    const card = e.target.closest('.role-card');
    if (!card) return;

    document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedRole = card.dataset.role;
    updateGenerateButton();
  });

  // Work items input - update button state on input
  workItemsInput.addEventListener('input', () => {
    updateGenerateButton();
  });

  // Week buttons
  document.getElementById('weekMinus').addEventListener('click', () => {
    if (currentWeek > 1) {
      currentWeek--;
      updateWeekDisplay();
    }
  });

  document.getElementById('weekPlus').addEventListener('click', () => {
    if (currentWeek < 53) {
      currentWeek++;
      updateWeekDisplay();
    }
  });

  // Generate button
  document.getElementById('generateBtn').addEventListener('click', () => {
    handleGenerate();
  });

  // Copy button
  document.getElementById('copyBtn').addEventListener('click', () => {
    const text = getReportPlainText();
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✓ 已复制';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 复制到剪贴板';
        btn.classList.remove('copied');
      }, 2000);
    }).catch(() => {
      // Fallback for older browsers
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✓ 已复制';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '📋 复制到剪贴板';
          btn.classList.remove('copied');
        }, 2000);
      } catch (err) {
        // Silently fail
      }
      document.body.removeChild(textarea);
    });
  });

  // Regenerate button
  document.getElementById('regenerateBtn').addEventListener('click', () => {
    handleGenerate();
  });
}

function updateWeekDisplay() {
  document.getElementById('weekNumber').textContent = currentWeek;
}

function updateGenerateButton() {
  const btn = document.getElementById('generateBtn');
  const hint = document.getElementById('generateHint');
  const workItemsInput = document.getElementById('workItemsInput');
  const hasWorkItems = workItemsInput.value.trim().length > 0;

  if (selectedRole && hasWorkItems && !isGenerating) {
    btn.disabled = false;
    hint.textContent = `当前角色: ${ROLE_NAMES[selectedRole]}`;
  } else {
    btn.disabled = true;
    if (!selectedRole && !hasWorkItems) {
      hint.textContent = '请先选择一个角色并填写工作内容';
    } else if (!selectedRole) {
      hint.textContent = '请先选择一个角色';
    } else if (!hasWorkItems) {
      hint.textContent = '请填写本周工作内容';
    } else {
      hint.textContent = '生成中...';
    }
  }
}

// Start
init();
</script>
